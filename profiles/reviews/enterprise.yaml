schema: agora-ai-sdlc/review-policy/v1
id: enterprise
adoption_profile: enterprise
reviews:
  - id: business-review
    mandatory: true
    required_approval_roles: [product-owner]
    required_evidence_types: [business-decision]
    independent_review_profiles: []
  - id: architecture-review
    mandatory: true
    required_approval_roles: [architect]
    required_evidence_types: [architecture-review]
    independent_review_profiles: [distinct-actor]
  - id: security-compliance-review
    mandatory: true
    required_approval_roles: [security-reviewer]
    required_evidence_types: [security-review, compliance-review]
    independent_review_profiles: [distinct-actor]
  - id: quality-review
    mandatory: true
    required_approval_roles: [quality-reviewer]
    required_evidence_types: [quality-review, test-summary]
    independent_review_profiles: [distinct-actor, human-final]
  - id: operational-readiness-review
    mandatory: true
    required_approval_roles: [operator]
    required_evidence_types: [operational-readiness, rollback-evidence]
    independent_review_profiles: [distinct-actor]
