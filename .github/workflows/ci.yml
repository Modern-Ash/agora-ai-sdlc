name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - name: Verify
        run: uv run --python ${{ matrix.python }} python scripts/verify_all.py 2>&1 | tee verify.log
        shell: bash
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ matrix.python }}
          path: verify.log
  core-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test against the newest supported Core
        run: |
          python -m pip install --quiet "agora-framework==0.9.0" pytest "packaging>=24" pyyaml jsonschema
          python -m pip install --quiet --no-deps -e .
          python -m pytest -q
