schema: agora-ai-sdlc/adoption-profile/v1
id: modernization
extends: starter
depth: comprehensive
method:
  id: ai-sdlc
  version: 0.1.1
strategy: incremental-slices
gate_obligations:
  readiness-approved:
    artifacts: [legacy-inventory, dependency-map, characterization]
    evidence: []
  intent-framed:
    artifacts: []
    evidence: []
  architecture-approved:
    artifacts: [target-architecture, migration-plan, migration-slice]
    evidence: []
  build-verified:
    artifacts: [conversion-record, equivalence-report]
    evidence: [behavioral-equivalence]
  completion:
    artifacts: [cutover-plan, rollback-procedure, stabilization-report]
    evidence: [cutover, rollback-validation, stabilization]
behavior_statuses: [known, unknown]
equivalence_results: [equivalent, accepted-difference, regression, unknown]
rules:
  - unknown behavior has no inferred baseline
  - every slice is independently deployable and traces to the migration plan
  - every slice has conversion and equivalence records
  - accepted differences require evidence, explanation and accountable approval
  - unexplained regressions block operations
  - cutover, rollback validation and stabilization block completion when absent

