schema: "agora-ai-sdlc/executor-adapters/v1"
executors:
  codex:
    kind: "agent"
    argv: ["{executable}", "exec", "--ephemeral", "--color", "never", "{prompt}"]
  claude:
    kind: "agent"
    argv:
      - "{executable}"
      - "--print"
      - "--permission-mode"
      - "acceptEdits"
      - "--allowedTools"
      - "Read"
      - "Write"
      - "Edit"
      - "Bash(pwd)"
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(aisdlc verify:*)"
      - "Bash(agora artifact add:*)"
      - "Bash(agora evidence add:*)"
      - "Bash(agora work readiness:*)"
      - "Bash(agora work criterion-satisfy:*)"
      - "--no-session-persistence"
      - "{prompt}"
  opencode:
    kind: "agent"
    argv: ["{python}", "-m", "agora_ai_sdlc.opencode_runner", "--executable", "{executable}", "--root", "{root}", "--model", "{model}", "--prompt", "{prompt}"]
  ollama:
    kind: "provider"
    guidance: "Ollama is a model provider for this flow; select an agent host such as OpenCode and configure it to use Ollama."
