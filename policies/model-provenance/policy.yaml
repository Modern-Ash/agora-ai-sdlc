schema: agora-ai-sdlc/model-provenance-policy/v1
sources: [observed, declared, unavailable]   # trust order, highest first
default_min_source: declared
fields: [runtime, runtime_version, provider, model, selection_reason]
separation_dimensions: [actor, runtime, provider, model]
rules:
  - unavailable provenance never counts as distinct
  - model names never imply provider identity
  - credentials, tokens and endpoint URLs are never accepted
