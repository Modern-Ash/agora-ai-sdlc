schema: agora-ai-sdlc/aws-original-rules/v1
id: aws-original
version: 1.0.0
profile: aws-original

base_rules:
  - capability: three-phase-lifecycle
    classification: base-method
    pass:
      - type: front-matter-list-equals
        path: registry/method-versions/ai-sdlc/0.2.0/METHOD.md
        field: work-states
        values: [inception, construction, operations, completed]
    partial:
      - type: front-matter-list-contains
        path: registry/method-versions/ai-sdlc/0.2.0/METHOD.md
        field: work-states
        values: [inception, construction, operations]
    evidence: [registry/method-versions/ai-sdlc/0.2.0/METHOD.md]
    remediation: Ship Method Pack 0.2.0 with Inception, Construction and Operations as the canonical phases; keep completed only as Agora's terminal recording state.

  - capability: ai-initiated-planning
    classification: base-method
    pass:
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md
        values: [plan -> clarify -> human decision -> execute -> validate, AI drafts a plan]
    partial: []
    evidence: [registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md]
    remediation: Make AI-proposed planning and clarification-before-execution normative in the Method Pack protocol.

  - capability: human-validation
    classification: base-method
    pass:
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md
        values: [human decision, no phase advances without its gate]
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/gates/inception-approved.md
        values: [required-approval-roles]
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/gates/completion.md
        values: [required-approval-roles]
    partial: []
    evidence:
      - registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md
      - registry/method-versions/ai-sdlc/0.2.0/gates/inception-approved.md
      - registry/method-versions/ai-sdlc/0.2.0/gates/completion.md
    remediation: Require accountable human approval before AI execution/phase advancement.

  - capability: minimal-roles
    classification: base-method
    pass:
      - type: front-matter-list-equals
        path: registry/method-versions/ai-sdlc/0.2.0/METHOD.md
        field: required-roles
        values: [product-owner, developer]
    partial:
      - type: front-matter-list-contains
        path: registry/method-versions/ai-sdlc/0.2.0/METHOD.md
        field: required-roles
        values: [product-owner]
    evidence: [registry/method-versions/ai-sdlc/0.2.0/METHOD.md, registry/method-versions/ai-sdlc/0.2.0/roles/product-owner.md]
    remediation: Make Product Owner and Developer the base required roles and move specialist/governance roles to optional extensions.

  - capability: intent
    classification: base-method
    pass:
      - type: file-exists
        path: templates/product-intent.md
      - type: file-contains-all
        path: docs/method/artifacts.md
        values: [intent, product-intent.md]
    partial: []
    evidence: [templates/product-intent.md, docs/method/artifacts.md]
    remediation: Provide a durable Intent artifact traced into Units.

  - capability: units
    classification: base-method
    pass:
      - type: file-exists
        path: templates/unit-of-work.md
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md
        values: [Unit of Work, bounded slice]
    partial: []
    evidence: [templates/unit-of-work.md, registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md]
    remediation: Model Units as independently deliverable slices traced to Intent and acceptance criteria.

  - capability: bolts
    classification: base-method
    pass:
      - type: file-exists
        path: templates/bolt-plan.md
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md
        values: [bolt, short]
    partial:
      - type: file-contains-all
        path: templates/unit-of-work.md
        values: [Bolts]
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md
        values: [bolt]
    evidence: [templates/unit-of-work.md, registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md]
    remediation: Promote each Bolt to a first-class, human-validated execution record supporting sequential/parallel delivery.

  - capability: level-1-plan
    classification: base-method
    pass:
      - type: file-exists
        path: templates/plan.md
      - type: file-contains-all
        path: templates/plan.md
        values: [Level, approval]
    partial:
      - type: file-exists
        path: templates/implementation-plan.md
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md
        values: [plan]
    evidence: [registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md, templates/implementation-plan.md]
    remediation: Add a first-class Level 1 Plan artifact that is approved before method execution.

  - capability: recursive-planning
    classification: base-method
    pass:
      - type: file-exists
        path: templates/plan.md
      - type: file-contains-all
        path: templates/plan.md
        values: [parent, Level]
    partial: []
    evidence: [templates/plan.md]
    remediation: Represent Level 2..N plans with parent links and reapproval on plan revision.

  - capability: persistent-context
    classification: base-method
    pass:
      - type: file-contains-all
        path: docs/method/artifacts.md
        values: [traces-to, shipped in the wheel, traceability]
      - type: file-exists
        path: src/agora_ai_sdlc/artifacts.py
    partial: []
    evidence: [docs/method/artifacts.md, src/agora_ai_sdlc/artifacts.py]
    remediation: Persist linked artifacts as durable project context.

  - capability: forward-backward-traceability
    classification: base-method
    pass:
      - type: file-contains-all
        path: src/agora_ai_sdlc/artifacts.py
        values: [check_traceability, trace.dangling, trace.parent_kind]
      - type: file-contains-all
        path: docs/method/artifacts.md
        values: [traces-to]
    partial: []
    evidence: [src/agora_ai_sdlc/artifacts.py, docs/method/artifacts.md]
    remediation: Enforce resolvable parent links and criterion coverage across persisted artifacts.

  - capability: user-stories
    classification: base-method
    pass:
      - type: file-exists
        path: templates/user-stories.md
    partial:
      - type: file-contains-all
        path: templates/requirements.md
        values: [Acceptance criteria]
    evidence: [templates/user-stories.md, templates/requirements.md]
    remediation: Add a dedicated user-stories artifact preserving story/acceptance-criteria contracts.

  - capability: non-functional-requirements
    classification: base-method
    pass:
      - type: file-exists
        path: templates/nfr.md
    partial: []
    evidence: [templates/requirements.md]
    remediation: Keep NFRs explicit and required in requirements elaboration.

  - capability: risk-register
    classification: base-method
    pass:
      - type: file-exists
        path: templates/risk-register.md
    partial:
      - type: file-contains-all
        path: templates/product-intent.md
        values: [Risk]
    evidence: [templates/risk-register.md, templates/product-intent.md]
    remediation: Add a dedicated risk-register artifact with optional external register references.

  - capability: measurement-criteria
    classification: base-method
    pass:
      - type: file-exists
        path: templates/measurement-criteria.md
    partial:
      - type: file-contains-all
        path: templates/product-intent.md
        values: [Success]
    evidence: [templates/measurement-criteria.md, templates/product-intent.md]
    remediation: Add measurement criteria traced to Intent and stories.

  - capability: domain-design
    classification: base-method
    pass:
      - type: file-exists
        path: templates/domain-model.md
    partial: []
    evidence: [templates/domain-model.md]
    remediation: Preserve Domain Design as an explicit construction artifact.

  - capability: logical-design
    classification: base-method
    pass:
      - type: file-exists
        path: templates/logical-design.md
    partial:
      - type: file-exists
        path: templates/architecture.md
    evidence: [templates/logical-design.md, templates/architecture.md]
    remediation: Add a Logical Design artifact with NFR patterns and ADR links.

  - capability: deployment-units
    classification: base-method
    pass:
      - type: file-exists
        path: templates/deployment-unit.md
    partial:
      - type: files-exist
        paths: [templates/deployment-plan.md, templates/test-strategy.md]
    evidence: [templates/deployment-unit.md, templates/deployment-plan.md, templates/test-strategy.md]
    remediation: Model Deployment Units explicitly and link functional/security/NFR evidence.

  - capability: operations-observability
    classification: base-method
    pass:
      - type: files-exist
        paths: [docs/integrations/observability.md, src/agora_ai_sdlc/operational_evidence.py]
      - type: file-contains-all
        path: docs/integrations/observability.md
        values: [metrics, observability, telemetry]
    partial: []
    evidence: [docs/integrations/observability.md, src/agora_ai_sdlc/operational_evidence.py]
    remediation: Keep telemetry analysis and normalized operational evidence provider-neutral.

  - capability: operations-governed-remediation
    classification: base-method
    pass:
      - type: file-contains-all
        path: docs/integrations/observability.md
        values: [must pass normal Agora gates, does not execute]
    partial:
      - type: file-contains-all
        path: docs/integrations/observability.md
        values: [remediation]
    evidence: [docs/integrations/observability.md]
    remediation: Require human-governed remediation proposals before operational mutation.

  - capability: brownfield-semantic-elevation
    classification: base-method
    pass:
      - type: files-exist
        paths: [templates/static-system-model.md, templates/dynamic-system-model.md]
    partial:
      - type: files-exist
        paths: [templates/legacy-inventory.md, templates/dependency-map.md, templates/characterization.md]
    evidence:
      - templates/legacy-inventory.md
      - templates/dependency-map.md
      - templates/characterization.md
    remediation: Add explicit static and dynamic semantic system-model artifacts before brown-field construction.

  - capability: prfaq
    classification: base-method
    pass:
      - type: file-exists
        path: templates/prfaq.md
    partial: []
    evidence: [templates/prfaq.md]
    remediation: Add the optional PRFAQ template without making it a mandatory gate artifact.

  - capability: quality-reviewer
    classification: base-method
    pass:
      - type: file-exists
        path: registry/method-versions/ai-sdlc/0.2.0/roles/quality-reviewer.md
    partial: []
    evidence: [registry/method-versions/ai-sdlc/0.2.0/roles/quality-reviewer.md]
    remediation: Keep QA/reviewer participation available as an optional method participant.

additive_governance:
  - id: fail-closed-gates
    classification: agora-additive
    checks:
      - type: file-contains-all
        path: registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md
        values: [Fail closed, missing evidence, missing approval]
    evidence: [registry/method-versions/ai-sdlc/0.2.0/PROTOCOL.md]
    reason: Agora adds enforceable fail-closed gates beyond the base public method narrative.

  - id: independent-review
    classification: agora-additive
    checks:
      - type: files-exist
        paths: [src/agora_ai_sdlc/independent_review.py, docs/policies/independent-review.md]
    evidence: [src/agora_ai_sdlc/independent_review.py, docs/policies/independent-review.md]
    reason: Agora adds artifact-scoped independent-review governance.

  - id: provider-neutrality
    classification: agora-additive
    checks:
      - type: file-contains-all
        path: AGENTS.md
        values: [No mandatory dependency on any provider, model, cloud or agent product]
    evidence: [AGENTS.md]
    reason: Agora deliberately makes method execution replaceable across providers/models/clouds.

  - id: model-provenance
    classification: agora-additive
    checks:
      - type: file-exists
        path: src/agora_ai_sdlc/provenance.py
    evidence: [src/agora_ai_sdlc/provenance.py]
    reason: Agora adds model/session provenance as governance evidence.
